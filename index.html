<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雲端班表修改</title>
  <!-- 載入 LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select, button { width: 100%; padding: 10px; font-size: 16px; box-sizing: border-box; }
    button { background-color: #06C755; color: white; border: none; border-radius: 5px; margin-top: 10px; font-weight: bold; }
    #user-info { margin-bottom: 20px; color: #555; }
  </style>
</head>
<body>

  <h2>📅 班表修改</h2>
  <div id="user-info">正在驗證 LINE 身份...</div>

  <form id="shift-form">
    <div class="form-group">
      <label>日期：</label>
      <input type="date" id="date" required>
    </div>
    <div class="form-group">
      <label>姓名：</label>
      <input type="text" id="name" placeholder="請輸入姓名" required>
    </div>
    <div class="form-group">
      <label>欲變更班別：</label>
      <select id="shift">
        <option value="早班">早班</option>
        <option value="中班">中班</option>
        <option value="晚班">晚班</option>
        <option value="休假">休假</option>
      </select>
    </div>
    <button type="submit" id="submit-btn" disabled>確認修改班表</button>
  </form>

  <script>
    // ⚠️ 請替換為您的 LIFF ID 與 GAS API 網址
    const LIFF_ID = "YOUR_LIFF_ID";
    const GAS_API_URL = "YOUR_GAS_WEB_APP_URL";

    let currentUser = { userId: "", userName: "" };

    async function initLiff() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          const profile = await liff.getProfile();
          currentUser.userId = profile.userId;
          currentUser.userName = profile.displayName;
          document.getElementById("user-info").innerText = `操作者：${profile.displayName}`;
          document.getElementById("submit-btn").disabled = false;
        }
      } catch (err) {
        document.getElementById("user-info").innerText = "LIFF 初始化失敗：" + err.message;
      }
    }

    document.getElementById("shift-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      document.getElementById("submit-btn").disabled = true;

      const payload = {
        userId: currentUser.userId,
        userName: currentUser.userName,
        date: document.getElementById("date").value,
        name: document.getElementById("name").value,
        shift: document.getElementById("shift").value
      };

      try {
        const response = await fetch(GAS_API_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const result = await response.json();

        if (result.status === "success") {
          alert("班表修改成功！");
          liff.closeWindow(); // 修改完成自動關閉 LIFF 視窗
        } else {
          alert("修改失敗：" + result.message);
          document.getElementById("submit-btn").disabled = false;
        }
      } catch (err) {
        alert("發送請求失敗，請稍後再試。");
        document.getElementById("submit-btn").disabled = false;
      }
    });

    initLiff();
  </script>
</body>
</html>
