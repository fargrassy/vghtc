<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雲端班表檢視與修改</title>
  <!-- 載入 LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 10px; background-color: #f8f9fa; }
    h2 { text-align: center; color: #333; margin-bottom: 5px; font-size: 20px; }
    #user-info { text-align: center; color: #666; font-size: 13px; margin-bottom: 12px; }
    
    .table-container { overflow-x: auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    table { width: 100%; border-collapse: collapse; text-align: center; table-layout: fixed; }
    th, td { border: 1px solid #dee2e6; padding: 6px 4px; font-size: 13px; word-wrap: break-word; }
    th { background-color: #e9ecef; font-weight: bold; }
    
    th.col-item { width: 34%; background-color: #f1f3f5; }
    th.col-h, th.col-i { width: 33%; }

    /* 儲存格狀態樣式 */
    td.item-name { background-color: #f8f9fa; font-weight: bold; color: #495057; text-align: center; }
    input.cell-input { width: 95%; padding: 5px 2px; border: 1px solid #ced4da; border-radius: 4px; text-align: center; font-size: 13px; box-sizing: border-box; }
    input.editable { background-color: #e8f0fe; border-color: #4285f4; font-weight: bold; color: #1a73e8; }
    input:disabled { background-color: transparent; border: none; color: #212529; }
    
    .btn-container { text-align: center; margin-top: 15px; margin-bottom: 20px; }
    .save-btn { background-color: #06C755; color: white; border: none; padding: 12px 28px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 80%; max-width: 300px; }
    .save-btn:disabled { background-color: #ccc; }
  </style>
</head>
<body>

  <h2>📅 雲端班表</h2>
  <div id="user-info">載入中...</div>

  <div class="table-container">
    <table id="sheet-table">
      <thead>
        <tr>
          <th class="col-item">項目 (G)</th>
          <th class="col-h">H 欄</th>
          <th class="col-i">I 欄</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <!-- 資料由 JS 動態生成 -->
      </tbody>
    </table>
  </div>

  <div class="btn-container">
    <button class="save-btn" id="save-btn" onclick="saveChanges()" disabled>儲存修改</button>
  </div>

  <script>
    // ⚠️ 請替換為您的 LIFF ID 與 GAS API 正式網址
    const LIFF_ID = "YOUR_LIFF_ID";
    const GAS_API_URL = "YOUR_GAS_WEB_APP_URL";

    let currentUser = { userId: "", userName: "" };
    let originalData = [];

    // 初始化 LIFF
    async function initLiff() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          const profile = await liff.getProfile();
          currentUser.userId = profile.userId;
          currentUser.userName = profile.displayName;
          document.getElementById("user-info").innerText = `操作者：${profile.displayName}`;
          loadSheetData();
        }
      } catch (err) {
        document.getElementById("user-info").innerText = "LIFF 初始化失敗：" + err.message;
      }
    }

    // 判斷列號是否落在授權修改區間 (H4~I14, H16~I26, H28~I38, H52~I62)
    function isRowEditable(rowNum) {
      return (rowNum >= 4 && rowNum <= 14) ||
             (rowNum >= 16 && rowNum <= 26) ||
             (rowNum >= 28 && rowNum <= 38) ||
             (rowNum >= 52 && rowNum <= 62);
    }

    // 向 GAS 抓取 G2:I62 數據並繪製表格
    async function loadSheetData() {
      try {
        const response = await fetch(GAS_API_URL);
        const result = await response.json();

        if (result.status === "error") {
          alert("載入失敗：" + result.message);
          return;
        }

        const sheetName = result.sheetName || "班表";
        originalData = result.data || [];

        // 更新頁面標題
        document.querySelector("h2").innerText = `📅 雲端班表 (${sheetName})`;

        const tbody = document.getElementById("table-body");
        tbody.innerHTML = "";

        // originalData[0] 對應第 2 列 (G2:I2)，originalData[60] 對應第 62 列 (G62:I62)
        originalData.forEach((row, index) => {
          const actualRowIndex = index + 2; // 對應 Google Sheets 真實行號 (2 ~ 62)
          const isEditableRow = isRowEditable(actualRowIndex);

          const tr = document.createElement("tr");

          // 1. 第一欄：G 欄項目名稱 (例如：星期, 日期, 大夜班, 小夜班...)
          const tdG = document.createElement("td");
          tdG.className = "item-name";
          tdG.innerText = row[0] !== undefined ? row[0] : "";
          tr.appendChild(tdG);

          // 2. 第二與第三欄：H 欄與 I 欄班表資料
          const cols = [
            { name: 'H', index: 1, editable: isEditableRow },
            { name: 'I', index: 2, editable: isEditableRow }
          ];

          cols.forEach(col => {
            const td = document.createElement("td");
            const input = document.createElement("input");
            input.type = "text";
            input.value = row[col.index] !== undefined ? row[col.index] : "";
            input.id = `${col.name}${actualRowIndex}`; // 例如 H4, I4, H10...
            input.className = "cell-input" + (col.editable ? " editable" : "");
            
            if (!col.editable) {
              input.disabled = true; // 不可編輯區域設定唯讀
            }

            td.appendChild(input);
            tr.appendChild(td);
          });

          tbody.appendChild(tr);
        });

        document.getElementById("save-btn").disabled = false;
      } catch (err) {
        alert("載入班表失敗：" + err.message);
      }
    }

    // 比對並送出修改內容
    async function saveChanges() {
      const saveBtn = document.getElementById("save-btn");
      saveBtn.disabled = true;
      saveBtn.innerText = "儲存中...";

      let updatePromises = [];

      // 檢查許可區間內 H 欄與 I 欄是否有異動
      originalData.forEach((row, index) => {
        const actualRowIndex = index + 2;
        if (isRowEditable(actualRowIndex)) {
          const cols = [
            { name: 'H', index: 1 },
            { name: 'I', index: 2 }
          ];

          cols.forEach(col => {
            const cellId = `${col.name}${actualRowIndex}`;
            const inputElem = document.getElementById(cellId);
            if (inputElem) {
              const inputVal = inputElem.value;
              const oldVal = row[col.index] !== undefined ? String(row[col.index]) : "";

              if (inputVal !== oldVal) {
                const payload = {
                  cell: cellId,
                  value: inputVal,
                  userId: currentUser.userId,
                  userName: currentUser.userName
                };

                const promise = fetch(GAS_API_URL, {
                  method: "POST",
                  body: JSON.stringify(payload)
                });

                updatePromises.push(promise);
              }
            }
          });
        }
      });

      if (updatePromises.length === 0) {
        alert("資料未有任何變更。");
        saveBtn.disabled = false;
        saveBtn.innerText = "儲存修改";
        return;
      }

      try {
        await Promise.all(updatePromises);
        alert("班表修改成功！");
        liff.closeWindow();
      } catch (err) {
        alert("部分資料儲存失敗，請重試。");
        saveBtn.disabled = false;
        saveBtn.innerText = "儲存修改";
      }
    }

    initLiff();
  </script>
</body>
</html>
